name: CI · Cliente móvil

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint · Build · Unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Código fuente
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Análisis estático (Android Lint)
        run: ./gradlew lintDebug

      - name: Build de depuración
        run: ./gradlew assembleDebug

      - name: Pruebas unitarias con cobertura (umbral ≥ 70 %)
        run: ./gradlew testDebugUnitTest koverXmlReportDebug koverVerifyDebug

      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-unitarias
          path: app/build/reports/kover/
          if-no-files-found: ignore

      - name: Reporte de Android Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-unitarias
          path: app/build/reports/tests/
          if-no-files-found: ignore
